[project]
name = "climatedata-api"
version = "0.1.0"
description = "ClimateData API"
readme = "README.md"
requires-python = ">=3.9,<3.10"
dependencies = [
    "click",
    "clisops",
    "flask",
    "flask-cors",
    "geopandas",
    "mapbox-vector-tile",
    "netcdf4~=1.6.0",
    "numpy~=1.23.0",
    "pandas",
    "protobuf>=3.19.4,<4.21.0",
    "requests",
    "scipy",
    "selenium",
    "sentry-sdk[flask]",
    "validators",
    "wheel",
    "xarray~=2022.3.0",
]

[dependency-groups]
dev = [
    "autopep8",
    "isort",
    "pylint",
    "pytest",
]

[tool.uv]
package = false
